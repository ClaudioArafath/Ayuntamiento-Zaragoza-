<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - Ayuntamiento de Zaragoza</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Estilos personalizada -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script>
    // Validación de contraseñas en el cliente
    function validatePasswords() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (password.length < 6) {
        alert('❌ La contraseña debe tener al menos 6 caracteres');
        return false;
      }

      if (password !== confirmPassword) {
        alert('❌ Las contraseñas no coinciden');
        return false;
      }

      return true;
    }

    // Mostrar/ocultar contraseña
    function togglePassword(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);

      if (input.type === 'password') {
        input.type = 'text';
        button.textContent = '🙈';
      } else {
        input.type = 'password';
        button.textContent = '👁️';
      }
    }
  </script>
</head>
<img src="../media/background_horizontal.png" alt="Fondo Login"
  class="fixed inset-0 w-full h-full object-cover opacity-10 -z-10">

<body class="bg-gray-100 flex items-center justify-center h-screen font-sans">

  <div class="w-full max-w-md bg-neutral p-10 rounded-3xl shadow-2xl border-3">
    <!-- Logo del Ayuntamiento -->
    <div class="flex justify-center mb-6">
      <img src="../media/Ayuntamiento.png" alt="Logo Ayuntamiento" class="h-32 w-auto">
    </div>

    <h1 class="text-2xl font-bold text-gray-700 text-center mb-2">
      Restablecer Contraseña
    </h1>

    <p class="text-sm text-gray-600 text-center mb-6">
      Ingresa tu nueva contraseña a continuación.
    </p>

    <form action="../reset_password.php" method="POST" onsubmit="return validatePasswords()" class="space-y-4">
      <!-- Token oculto -->
      <input type="hidden" name="token" id="token" value="">

      <div>
        <label for="password" class="block text-sm font-medium text-gray-600">Nueva Contraseña</label>
        <div class="relative">
          <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres"
            class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-gray-300 pr-12">
          <button type="button" id="toggleBtn1" onclick="togglePassword('password', 'toggleBtn1')"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 mt-0.5">
            👁️
          </button>
        </div>
      </div>

      <div>
        <label for="confirm_password" class="block text-sm font-medium text-gray-600">Confirmar Contraseña</label>
        <div class="relative">
          <input type="password" id="confirm_password" name="confirm_password" required
            placeholder="Repite la contraseña"
            class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-gray-300 pr-12">
          <button type="button" id="toggleBtn2" onclick="togglePassword('confirm_password', 'toggleBtn2')"
            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700 mt-0.5">
            👁️
          </button>
        </div>
      </div>

      <button type="submit"
        class="w-full py-2 bg-green-600 text-white font-semibold rounded-lg shadow hover:bg-green-700 transition">
        Restablecer Contraseña
      </button>
    </form>

    <!-- Regresar al login -->
    <div class="text-center mt-6">
      <a href="login.html" class="text-sm text-blue-600 hover:underline flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Regresar al inicio de sesión
      </a>
    </div>
  </div>

  <script>
    // Obtener token de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (token) {
      document.getElementById('token').value = token;
    } else {
      alert('❌ Token no válido. Por favor solicita un nuevo enlace de recuperación.');
      window.location.href = 'forgot_password.html';
    }
  </script>

</body>

</html>
