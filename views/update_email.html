<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Email - Ayuntamiento de Zaragoza</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos personalizada -->
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<img src="../media/background_horizontal.png" alt="Fondo"
    class="fixed inset-0 w-full h-full object-cover opacity-10 -z-10">

<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans p-4">

    <div class="w-full max-w-md bg-neutral p-10 rounded-3xl shadow-2xl border-3">
        <!-- Logo del Ayuntamiento -->
        <div class="flex justify-center mb-6">
            <img src="../media/Ayuntamiento.png" alt="Logo Ayuntamiento" class="h-32 w-auto">
        </div>

        <h1 class="text-2xl font-bold text-gray-700 text-center mb-2">
            Actualizar Email
        </h1>

        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6">
            <p class="text-sm text-gray-700">
                <strong>📧 Importante:</strong> Necesitas agregar un email a tu cuenta para poder recuperar tu
                contraseña en caso de olvidarla.
            </p>
        </div>

        <form action="../update_email.php" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-600">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="Tu nombre de usuario"
                    class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-gray-300">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-600">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Tu contraseña actual"
                    class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-gray-300">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-600">Nuevo Email</label>
                <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com"
                    class="w-full px-4 py-2 mt-1 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none border-gray-300">
            </div>

            <button type="submit"
                class="w-full py-2 bg-green-600 text-white font-semibold rounded-lg shadow hover:bg-green-700 transition">
                Actualizar Email
            </button>
        </form>

        <!-- Regresar al login -->
        <div class="text-center mt-6">
            <a href="login.html" class="text-sm text-blue-600 hover:underline flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Regresar al inicio de sesión
            </a>
        </div>
    </div>

</body>

</html>
